apiVersion: apps/v1
kind: Deployment
metadata:
  name: rapt-service-deployment
  labels:
    app: rapt-service
spec:
  replicas: 4
  selector:
    matchLabels:
      app: rapt-service-pod
  template:
    metadata:
      labels:
        app: rapt-service-pod
    spec:
      imagePullSecrets:
        - name: rapt-container-registry
      containers:
        - name: rapt-api
          image: registry.digitalocean.com/rapt-container-registry/rapt_service:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: rapt-prod-env-secrets
          ports:
            - containerPort: 9000

---

apiVersion: v1
kind: Service
metadata: 
  name: rapt-service
spec:
  type: ClusterIP
  ports:
    - name: http
      protocol: TCP
      port: 9000
      targetPort: 9000 # pod/container port
  selector:
    app: rapt-service-pod
  