name: Testing Rapt Chat App
run-name: Test API by @${{ github.actor }} 🚀

on: 
    workflow_call:
    workflow_dispatch:

jobs:
    test_api:
        runs-on: ubuntu-latest
        services:
          mysql-db:
            image: mysql:8
            env:
              MYSQL_ALLOW_EMPTY_PASSWORD: yes
              MYSQL_DATABASE: ${{ secrets.TEST_DATABASE_NAME }}
              MYSQL_USER: ${{ secrets.TEST_DATABASE_USER }}
              MYSQL_PASSWORD: ${{ secrets.TEST_DATABASE_PASSWORD }}
              MYSQL_HOST: ${{ secrets.TEST_DATABASE_HOST }}
              MYSQL_PORT: ${{ secrets.TEST_DATABASE_PORT }}
            ports:
              - 3306:3306
            options: >-
              --health-cmd="mysqladmin ping"
              --health-interval=10s
              --health-timeout=5s
              --health-retries=3
        env:
            SECRETS_CONTEXT: ${{ toJson(secrets) }}
        defaults:
          run:
            working-directory: service
        strategy:
          max-parallel: 4
          matrix:
            python-version: [3.10.12]
        steps:
            - name: Checkout code
              uses: actions/checkout@v2
            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v3
              with:
                python-version: ${{ matrix.python-version }}
            - name: Install Dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt
            - name: Run pytests
              run: 
                coverage run -m pytest
            - name: Generate Coverage Report
              run:
                coverage report -m