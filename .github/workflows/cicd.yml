name: Test, Build, and Deploy Rapt Chat App 🚀
run-name: Test, Build, and Deploy Rapt Chat App 🚀

on:
    workflow_call:
    workflow_dispatch:
    push:
        branches: [main,dev]
    pull_request:
        branches: [main,dev]

env:
    TEST_DATABASE_NAME: ${{ secrets.TEST_DATABASE_NAME }}
    TEST_DATABASE_USER: ${{ secrets.TEST_DATABASE_USER }}
    TEST_DATABASE_PASSWORD: ${{ secrets.TEST_DATABASE_PASSWORD }}
    TEST_DATABASE_HOST: ${{ secrets.TEST_DATABASE_HOST }}
    TEST_DATABASE_PORT: ${{ secrets.TEST_DATABASE_PORT }}
    TEST_DATABASE_ROOT_PASSWORD: ${{ secrets.TEST_DATABASE_ROOT_PASSWORD }}
    MYSQL_DRIVER: ${{ secrets.MYSQL_DRIVER }}
    MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
    MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
    MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
    MYSQL_USER: ${{ secrets.MYSQL_USER }}
    MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
    RABBITMQ_URL: ${{ secrets.RABBITMQ_URL }}
    SMSLEOPARD_ACCESS_TOKEN: ${{ secrets.SMSLEOPARD_ACCESS_TOKEN }}
    SMSLEOPARD_API_KEY: ${{ secrets.SMSLEOPARD_API_KEY }}
    SMSLEOPARD_API_SECRET: ${{ secrets.SMSLEOPARD_API_SECRET }}
    SMSLEOPARD_BASE_URL: ${{ secrets.SMSLEOPARD_BASE_URL }}
    SUPERUSER_NAME: ${{ secrets.SUPERUSER_NAME }}
    SUPERUSER_PHONE: ${{ secrets.SUPERUSER_PHONE }}
    VERIFICATION_CODE_EXPIRY_MILLISECONDS: ${{ secrets.VERIFICATION_CODE_EXPIRY_MILLISECONDS }}
    VERIFICATION_CODE_LENGTH: ${{ secrets.VERIFICATION_CODE_LENGTH }}
    HONEYBADGER_API_KEY: ${{ secrets.HONEYBADGER_API_KEY }}
    JWT_ALGORITHM: ${{ secrets.JWT_ALGORITHM }}
    JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
    ENVIRONMENT: ${{ secrets.ENVIRONMENT }}
    MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
    API_URL: ${{ secrets.API_URL }}

jobs:
    test:
        runs-on: ubuntu-latest
        services:
            mysql-db:
                image: mysql:8
                env:
                    MYSQL_ALLOW_EMPTY_PASSWORD: yes
                    MYSQL_DATABASE: ${{ env.TEST_DATABASE_NAME }}
                    MYSQL_USER: ${{ env.TEST_DATABASE_USER }}
                    MYSQL_PASSWORD: ${{ env.TEST_DATABASE_PASSWORD }}
                    MYSQL_HOST: ${{ env.TEST_DATABASE_HOST }}
                    MYSQL_PORT: ${{ env.TEST_DATABASE_PORT }}
                ports:
                - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=3
        defaults:
            run:
                working-directory: service
        strategy:
            max-parallel: 4
            matrix:
                python-version: [3.10.12]
        steps:
            -   name: Checkout code
                uses: actions/checkout@v2
            -   name: Set up Python ${{ matrix.python-version }}
                uses: actions/setup-python@v3
                with:
                    python-version: ${{ matrix.python-version }}
            -   name: Install Dependencies
                run: |
                    python -m pip install --upgrade pip
                    pip install -r requirements.txt
            -   name: Run pytests
                run: |
                    coverage run -m pytest
                    coverage report -m
        
    build:
        runs-on: ubuntu-latest
        env:
            K8S_CLUSTER_NAME: rapt-k8-cluster
        steps:
            -   name: Checkout code
                uses: actions/checkout@v3
            -   name: Install doctl
                uses: digitalocean/action-doctl@v2
                with:
                    token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

            -   name: Login to DO Registry with Short-lived credentials
                run: doctl registry login --expiry-seconds 1200
      
            -   name: Build rapt_service image
                run: |
                    docker build \
                        -t registry.digitalocean.com/rapt-container-registry/rapt_service:latest \
                        -t registry.digitalocean.com/rapt-container-registry/rapt_service:${GITHUB_SHA::7} \
                        service/
      
            -   name: Build rapt_server image
                run: |
                    docker build \
                        -t registry.digitalocean.com/rapt-container-registry/rapt_server:latest \
                        -t registry.digitalocean.com/rapt-container-registry/rapt_server:${GITHUB_SHA::7} \
                        nginx/
      
            -   name: Push Images
                run: | 
                    docker push registry.digitalocean.com/rapt-container-registry/rapt_service --all-tags
                    docker push registry.digitalocean.com/rapt-container-registry/rapt_server --all-tags
        
    deploy:
        runs-on: ubuntu-latest
        env:
            K8S_CLUSTER_NAME: rapt-k8-cluster
        steps:
            -   name: Checkout code
                uses: actions/checkout@v3

            -   name: Install doctl
                uses: digitalocean/action-doctl@v2
                with:
                    token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

            -   name: Login to DO Registry with Short-lived credentials
                run: doctl registry login --expiry-seconds 1200
          
            -   name: K8s cluster kubeconfig file with Short-lived credentials
                run: |
                  doctl kubernetes cluster kubeconfig save --expiry-seconds 600 ${{ env.K8S_CLUSTER_NAME }}
        
            -   name: Update k8s secrets
                run: |
                  cat << EOF >> ./.env.prod
                  MYSQL_HOST=${{ env.MYSQL_HOST }}
                  MYSQL_PORT=${{ env.MYSQL_PORT }}
                  MYSQL_ROOT_PASSWORD=${{ env.MYSQL_ROOT_PASSWORD }}
                  MYSQL_DATABASE=${{ env.MYSQL_DATABASE }}
                  MYSQL_USER=${{ env.MYSQL_USER }}
                  MYSQL_PASSWORD=${{ env.MYSQL_PASSWORD }}
                  API_URL=${{ env.API_URL }}
                  EOF
        
                  kubectl delete secrets rapt-prod-env-secrets
                  kubectl create secret generic rapt-prod-env-secrets --from-env-file ./.env.prod
            
            -   name: Apply k8s manifests
                run: |
                  kubectl apply -f k8s/rapt_service.yml
                  kubectl apply -f k8s/rapt_server.yml

            -   name: Update Deployment Images
                run: |
                  kubectl set image deployment/rapt-service-deployment rapt-api=registry.digitalocean.com/rapt-container-registry/rapt_service:${GITHUB_SHA::7}
                  kubectl set image deployment/rapt-server-deployment rapt-server=registry.digitalocean.com/rapt-container-registry/rapt_server:${GITHUB_SHA::7}
        
            -   name: Wait for Rollout to finish
                run: |
                  kubectl rollout status deployment/rapt-api-deployment
                  kubectl rollout status deployment/rapt-server-deployment   
